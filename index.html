<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Video Synchronization Test V2</title>

    <link
        rel="stylesheet"
        href="teste-sincronizacao-v2.css">

</head>

<body data-theme="dark">

    <div
        class="background-decorations"
        aria-hidden="true">
    </div>

    <main class="container">

        <!--==================================================
                            TITLE
        ==================================================-->

        <header class="page-header">

            <h1>
                Percentage-Based Video Synchronization
            </h1>

            <p>
                Compare multiple synchronized videos using a percentage of their duration.
            </p>

        </header>


        <!--==================================================
                    TOOLBAR
        ==================================================-->

        <section class="top-controls">

            <input
                type="file"
                id="multiVideoInput"
                accept="video/*"
                multiple
                hidden>

            <button id="loadVideosBtn">
                📂 Select Videos
            </button>

            <button id="clearVideosBtn">
                🗑 Clear All
            </button>

        </section>


        <!--==================================================
                        CONTROLS
        ==================================================-->

        <section class="controls">

            <button id="playBtn">
                ▶ Play
            </button>

            <button id="pauseBtn">
                ⏸ Pause
            </button>

            <button id="restartBtn">
                ⏹ Restart
            </button>


            <div class="grid-selector">

                <button id="gridButton">
                    ▦ Grid
                </button>

                <div
                    id="gridMenu"
                    class="grid-menu">

                    <button data-grid="2">
                        2 Videos
                    </button>

                    <button data-grid="4">
                        4 Videos
                    </button>

                    <button data-grid="6">
                        6 Videos
                    </button>

                    <div class="unlimited-control">

                        <label for="unlimitedQuantity">
                            Unlimited
                        </label>

                        <input
                            id="unlimitedQuantity"
                            type="number"
                            min="1"
                            max="50"
                            value="8">

                    </div>

                    <button data-grid="unlimited">
                        Apply
                    </button>

                </div>

            </div>


            <button id="tempoButton">
                ⏱ Random Time
            </button>


            <div class="settings-selector">

                <button id="settingsButton">
                    ⚙ Settings
                </button>

                <div
                    id="settingsMenu"
                    class="settings-menu">

                    <label class="settings-option">

                        <input
                            type="checkbox"
                            id="autoRestartVideos"
                            checked>

                        Restart videos when they end

                    </label>

                    <label class="settings-option">

                        <input
                            type="checkbox"
                            id="noVerticalCover">

                        Preserve vertical video aspect ratio

                    </label>

                    <label class="settings-option">

                        <input
                            type="checkbox"
                            id="darkMode">

                        Light mode

                    </label>

                    <div class="settings-slider-group">

                        <label for="gridScaleSlider">
                            Grid size
                        </label>

                        <input
                            id="gridScaleSlider"
                            type="range"
                            min="0.8"
                            max="1.6"
                            step="0.05"
                            value="1">

                    </div>

                </div>

            </div>

        </section>


        <!--==================================================
                    GLOBAL SLIDER
        ==================================================-->

        <section class="global-slider-area">

            <span>
                0%
            </span>

            <input
                type="range"
                id="globalSlider"
                min="0"
                max="100"
                value="0"
                step="0.01">

            <span>
                100%
            </span>

        </section>


        <!--==================================================
                    VIDEO AREA
        ==================================================-->

        <section
            id="videoGrid"
            class="video-grid">

            <!--
                Players are created automatically by JavaScript.
            -->

        </section>

    </main>


    <script src="teste-sincronizacao-v2.js"></script>

</body>

</html>
